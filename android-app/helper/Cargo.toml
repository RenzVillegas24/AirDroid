[package]
name = "owly-k20-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
owly-radio = { path = "../../workspaces/shared/reference/owly-ref/crates/owly-radio" }
owly-awdl = { path = "../../workspaces/shared/reference/owly-ref/crates/owly-awdl", features = ["driver"] }
owly-airdrop = { path = "../../workspaces/shared/reference/owly-ref/crates/owly-airdrop", features = ["mdns"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
