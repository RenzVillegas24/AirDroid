name: Build Signed APK

# Temporary manual workflow: build and sign the current branch without
# publishing a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build ARM64 helper
        working-directory: android-app/helper
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          mkdir -p ../assets
          cp target/aarch64-unknown-linux-musl/release/owly-k20-helper \
            ../assets/owly-k20-helper

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AIRDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "missing repository secret AIRDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airdroid-release.jks"
          chmod 600 "$RUNNER_TEMP/airdroid-release.jks"

      - name: Build unsigned release APK
        env:
          SKIP_HELPER_BUILD: "1"
        run: scripts/build-app.sh release

      - name: Sign release APK
        shell: bash
        env:
          AIRDROID_KEYSTORE: ${{ runner.temp }}/airdroid-release.jks
          AIRDROID_KEY_ALIAS: ${{ secrets.AIRDROID_KEY_ALIAS || 'airdroid' }}
          AIRDROID_KEYSTORE_PASSWORD: ${{ secrets.AIRDROID_KEYSTORE_PASSWORD }}
          AIRDROID_KEY_PASSWORD: ${{ secrets.AIRDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$AIRDROID_KEYSTORE_PASSWORD" ]]; then
            echo "missing repository secret AIRDROID_KEYSTORE_PASSWORD" >&2
            exit 1
          fi
          if [[ -z "$AIRDROID_KEY_PASSWORD" ]]; then
            echo "missing repository secret AIRDROID_KEY_PASSWORD" >&2
            exit 1
          fi
          APK_OUT="$RUNNER_TEMP/AirDroid-1.6.1.apk"
          scripts/sign-release.sh \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$APK_OUT"
          echo "APK_PATH=$APK_OUT" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDroid-1.6.1-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
